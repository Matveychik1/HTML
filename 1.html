<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOWIY GOD</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f3f3;
            flex-grow: 1;
            border: 2px solid black;

        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            max-width: 800px;
            flex-grow: 1;
            border: 2px solid black;

        }
        .grid-item {
            position: relative;
            background-color: #ccc;
            overflow: hidden;
         
            border-radius: 8px;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .grid-item:nth-child(1) {
            grid-column: span 2;
            grid-row: span 2;
        }
        .grid-item:nth-child(6) {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item"><img src="https://storage.googleapis.com/pod_public/1300/179853.jpg" alt="Image 1"></div>
        <div class="grid-item"><img src="https://s3-eu-north-1.amazonaws.com/py3.visitsweden.com/original_images/f5030568_IBSweb.jpg" alt="Image 2"></div>
        <div class="grid-item"><img src="https://www.stralendzweden.nl/wp-content/uploads/2020/03/Safsen-Resort-dorpje-avond-768x549.jpg" alt="Image 3"></div>
        <div class="grid-item"><img src="https://hetzweedsehuis.nl/wp-content/uploads/2015/11/kerst-.jpg" alt="Image 4"></div>
        <div class="grid-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRX2zZc5N8oRbq9zZ0e_T-ZmTtIrsReJZZl3RkgDBoW3OQoBGJrpfK8dcgDypO0QWKrjFk&usqp=CAU" alt="Image 5"></div>
        <div class="grid-item"><img src="https://natureconservancy-h.assetsadobe.com/is/image/content/dam/tnc/nature/en/photos/t/n/tnc_16026894.jpg?crop=0%2C437%2C3986%2C2491&wid=640&hei=400&scl=6.228125" alt="Image 6"></div>
        <div class="grid-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBNjq66FcpQzSs0u5hlZ8NRkoF8qXKCEQ2OA&s" alt="Image 7"></div>
        <div class="grid-item"><img src="https://cdn.prod.website-files.com/624ac40503a527cf47af4192/6568745aae3f1ce79ce3725f_realistic-winter-photo.png" alt="Image 8"></div>
        <div class="grid-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwAPsywZ-g7HM2900qqzaGzu0EqerfGIuZkg&s" alt="Image 9"></div>
        <div class="grid-item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6DsusUbSTS4NL3Y7Xtohct4DjmwYMf1u6vQ&s" alt="Image 10"></div>
    </div>
</body>
</html>
